<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password - PetSphere</title>

    <style>
        body {
            background: #fff5e8;
            font-family: "Segoe UI", Arial;
            display: flex;
            justify-content: center;
            padding-top: 60px;
        }

        .card {
            width: 450px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.15);
            border-top: 5px solid #ffa500;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
            color: #cc8400;
        }

        label {
            display: block;
            font-weight: 600;
            margin-top: 12px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 2px solid #ffa500;
            border-radius: 8px;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            background: #ffa500;
            color: white;
            border: none;
            padding: 14px;
            margin-top: 25px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: .3s;
        }

        .btn:hover {
            background: #cc8400;
        }

        .back {
            text-align: center;
            margin-top: 15px;
            display: block;
            color: #cc8400;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Change Password</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Old Password</label>
        <input type="password" name="old_password" required>

        <label>New Password</label>
        <input type="password" name="new_password" required>

        <label>Confirm New Password</label>
        <input type="password" name="confirm_password" required>

        <button class="btn">Update Password</button>

    </form>

   
</div>

</body>
</html>
