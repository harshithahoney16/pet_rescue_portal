<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Report Found Pet</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg:#fff9f0;
    --primary:#ffa500;
    --primary-dark:#cc8400;
    --secondary:#ffe7b8;
    --text:#4a3b2d;
}

/* PAGE BASE */
body{
    margin:0;
    background:var(--bg);
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

/* MAIN CONTAINER */
.container{
    width:78%;
    max-width:950px;
    background:white;
    border-radius:18px;
    display:flex;
    overflow:hidden;
    box-shadow:0 4px 25px rgba(0,0,0,0.12);
    border:5px solid var(--primary);
}

/* LEFT IMAGE */
.image-section{
    width:38%;
}
.image-section img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: left center;  /* shows squirrel face properly */
}

/* RIGHT FORM */
.form-section{
    width:62%;
    padding:25px 28px;
}

h2{
    font-size:30px;
    font-weight:900;
    color:var(--primary-dark);
    margin-bottom:5px;
}
.subtitle{
    font-size:14px;
    opacity:.7;
    margin-bottom:18px;
}

/* ROW LAYOUT */
.row{
    display:flex;
    gap:15px;
    margin-bottom:15px;
    flex-wrap:wrap;
}
.row > div{
    flex:1 1 30%;
}

/* INPUT STYLES */
input,textarea,select{
    width:100%;
    padding:6px;
    height:34px;
    border-radius:8px;
    border:2px solid var(--primary);
    background:var(--secondary);
    font-size:14px;
}
textarea{
    height:75px;
}

input:focus,select:focus,textarea:focus{
    background:#fff0cc;
    border-color:var(--primary-dark);
}

label{
    font-size:13px;
    font-weight:600;
    margin-bottom:3px;
    display:block;
}

/* BUTTON STYLE */
button{
    width:100%;
    padding:12px;
    background:var(--primary);
    color:white;
    font-size:17px;
    font-weight:800;
    border:none;
    border-radius:10px;
    margin-top:12px;
    cursor:pointer;
}
button:hover{
    background:var(--primary-dark);
}

/* ALERT MESSAGE */
.alert{
    background:#d4ffcd;
    padding:10px;
    border-radius:8px;
    font-weight:600;
    color:#067a00;
    margin-bottom:15px;
}
</style>
</head>


<body>

<div class="container">

    <!-- IMAGE SIDE -->
    <div class="image-section">
        <img src="https://cdn.britannica.com/80/157580-004-FFB75F13.jpg">
    </div>

    <!-- FORM SIDE -->
    <div class="form-section">

        <h2>Report Found Pet</h2>
        <p class="subtitle">Help us find the rightful owner by sharing details.</p>

        {% if messages %}
        <div class="alert">
            {% for message in messages %} {{ message }} {% endfor %}
        </div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- ROW 1 -->
         <!-- OWNER NAME — FULL WIDTH -->
        <div class="row">
            <div style="flex:1 1 100%;">
        <label>Owner Name</label>
        <input type="text" name="owner_name"
               placeholder="If known (else leave blank)">
    </div>
</div>

        <div class="row">
            

            <div>
                <label>Species</label>
                <input type="text" name="species" placeholder="e.g., Dog / Cat / Bird" required>
            </div>
            <div>
                <label>Breed</label>
                <input type="text" name="breed" placeholder="e.g., Labrador / Persian">
            </div>
            <div>
                <label>Color</label>
                <input type="text" name="color" placeholder="e.g., Brown & White">
            </div>
        </div>

        <!-- ROW 2 -->
        <div class="row">
            <div>
                <label>Age</label>
                <input type="text" name="age" placeholder="e.g., 2 years">
            </div>
            <div>
                <label>Gender</label>
                <select name="gender" required>
                    <option value="">Select</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Unknown</option>
                </select>
            </div>
            <div>
                <label>Date Found</label>
                <input type="date" name="found_date" required>
            </div>
        </div>

        <!-- NEW ROW — Weight + Health -->
        <div class="row">
            <div>
                <label>Weight (Approx)</label>
                <input type="text" name="weight" placeholder="e.g., 5 kg">
            </div>
            <div>
                <label>Health Status</label>
                <input type="text" name="health_status" placeholder="e.g., Healthy / Injured">
            </div>
        </div>

        <!-- ROW 3 -->
        <div class="row">
            <div>
                <label>Phone</label>
                <input type="text" name="contact_number" placeholder="e.g., 9876543210" required>
            </div>
            <div>
                <label>Email (Optional)</label>
                <input type="email" name="contact_email" placeholder="e.g., example@gmail.com">
            </div>
            <div>
                <label>Location Found</label>
                <input type="text" name="location" placeholder="City / Area / Landmark" required>
            </div>
        </div>

        <!-- GOOGLE MAP URL -->
        <div class="row">
            <div>
                <label>Google Map URL</label>
                <input type="text"
       name="location_url"
       placeholder="Paste Google Maps link OR enter latitude, longitude">


                <button type="button" onclick="getFoundLocationUrl()"
                    style="margin-top:6px; background:#0099ff; color:white">
                    📍 Detect My Location
                </button>

                <p style="font-size:12px; opacity:.7; margin-top:5px;">
                    (Automatically fills Google Maps location)
                </p>
            </div>
        </div>

        <!-- DESC -->
        <label>Description / Marks</label>
        <textarea name="description" placeholder="e.g., collar, scars, behavior..."></textarea>

        <!-- IMAGE -->
        <label>Upload Pet Image</label>
        <input type="file" name="image">

        <button type="submit">Submit Found Report</button>

        </form>

    </div>
</div>

<script>
function getFoundLocationUrl() {
    if (!navigator.geolocation) {
        alert("Your browser does not support location access.");
        return;
    }

    navigator.geolocation.getCurrentPosition(function(pos) {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        document.querySelector("input[name='location_url']").value =
            `https://www.google.com/maps?q=${lat},${lng}`;
    }, function(err) {
        if (err.code === 1) alert("❗ Location permission denied.");
        else alert("⚠ Unable to get location. Try again.");
    });
}
</script>

</body>
</html>
