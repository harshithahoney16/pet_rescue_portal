<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pet Report Form</title>

    <style>
        :root {
            --bg: #fff9f0;
            --primary: #ffa500;
            --primary-dark: #cc8400;
            --secondary: #ffe7b8;
            --text: #4a3b2d;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding-top: 40px;
            color: var(--text);
        }

        .form-box {
            background: white;
            width: 480px;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.12);
            border-top: 5px solid var(--primary);
            animation: fadeIn 0.6s ease-out;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: bold;
            color: var(--primary-dark);
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: 1.5px solid var(--primary);
            background: var(--secondary);
            font-size: 14px;
        }

        textarea {
            height: 90px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-dark);
            background: #ffefcc;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease-in-out;
        }

        button:hover {
            background: var(--primary-dark);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

<div class="form-box">
    <h2>{{ title }}</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Pet Name</label>
        <input type="text" name="pet_name" placeholder="Enter pet name" required>

        <label>Pet Type (Dog / Cat / Others)</label>
        <input type="text" name="pet_type" placeholder="Example: Dog, Cat" required>

        <label>Color</label>
        <input type="text" name="color" placeholder="Enter color" required>

        <label>Location</label>
        <input type="text" name="location" placeholder="Where was the pet found/lost?" required>

        <label>Description</label>
        <textarea name="description" placeholder="Describe the pet..."></textarea>

        <label>Pet Image</label>
        <input type="file" name="pet_image">

        <button type="submit">Submit Report</button>
    </form>
</div>

</body>
</html>
